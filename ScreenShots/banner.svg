<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="100%" height="auto">
  <defs>
    <!-- Background Theme -->
    <linearGradient id="space-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020205" />
      <stop offset="45%" stop-color="#080714" />
      <stop offset="100%" stop-color="#010103" />
    </linearGradient>

    <!-- Main brand colors gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="30%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Connection line gradients -->
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop shadow filters -->
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .star {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="820" height="340" fill="url(#space-dark)" rx="24"/>

  <!-- Stars / Particles background layer -->
  <g opacity="0.4">
    <circle cx="80" cy="60" r="1.5" fill="#fff" class="star" style="animation-delay: 0s;"/>
    <circle cx="210" cy="110" r="1" fill="#fff" class="star" style="animation-delay: 0.5s;"/>
    <circle cx="720" cy="70" r="1.8" fill="#fff" class="star" style="animation-delay: 1s;"/>
    <circle cx="630" cy="230" r="1.2" fill="#fff" class="star" style="animation-delay: 1.5s;"/>
    <circle cx="150" cy="270" r="1.5" fill="#fff" class="star" style="animation-delay: 2s;"/>
    <circle cx="480" cy="90" r="1" fill="#fff" class="star" style="animation-delay: 2.5s;"/>
  </g>

  <!-- Grid lines overlay -->
  <path d="M 0,50 L 820,50 M 0,100 L 820,100 M 0,150 L 820,150 M 0,200 L 820,200 M 0,250 L 820,250 M 0,300 L 820,300" stroke="#ffffff" stroke-width="0.5" opacity="0.03" />
  <path d="M 100,0 L 100,340 M 200,0 L 200,340 M 300,0 L 300,340 M 400,0 L 400,340 M 500,0 L 500,340 M 600,0 L 600,340 M 700,0 L 700,340" stroke="#ffffff" stroke-width="0.5" opacity="0.03" />

  <!-- Animated Earth Orbit Ring -->
  <ellipse cx="410" cy="180" rx="350" ry="110" fill="none" stroke="url(#line-glow)" stroke-width="1.5" stroke-dasharray="15 15">
    <animate attributeName="stroke-dashoffset" values="300;0" dur="22s" repeatCount="indefinite" />
  </ellipse>

  <!-- Connecting Flight/Travel Paths -->
  <path d="M 120,240 Q 250,70 410,180 T 700,120" fill="none" stroke="url(#neon-glow)" stroke-width="2.5" stroke-dasharray="6, 300" filter="url(#neon-blur)">
    <animate attributeName="stroke-dashoffset" values="612;0" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M 700,120 Q 550,290 410,180 T 120,240" fill="none" stroke="url(#neon-glow)" stroke-width="2.5" stroke-dasharray="6, 300" filter="url(#neon-blur)">
    <animate attributeName="stroke-dashoffset" values="612;0" dur="6.5s" repeatCount="indefinite" />
  </path>

  <!-- Planet Core (Center Anchor) -->
  <circle cx="410" cy="180" r="32" fill="#04040d" stroke="url(#neon-glow)" stroke-width="2" />
  <!-- Earth continents mockup representation -->
  <path d="M 395,170 Q 405,165 415,172 Q 425,180 430,170 Q 425,190 415,195 Q 395,190 395,170 Z" fill="#3b82f6" opacity="0.4" />
  <circle cx="410" cy="180" r="32" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.2" />

  <!-- Animated orbiters -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 410 180" to="360 410 180" dur="12s" repeatCount="indefinite" />
    <circle cx="458" cy="180" r="4.5" fill="#ec4899" filter="url(#soft-glow)" />
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 410 180" to="0 410 180" dur="8s" repeatCount="indefinite" />
    <circle cx="354" cy="170" r="5.5" fill="#3b82f6" filter="url(#soft-glow)" />
  </g>

  <!-- Node Anchors -->
  <!-- Node Left -->
  <g transform="translate(120, 240)">
    <circle cx="0" cy="0" r="8" fill="#3b82f6" filter="url(#soft-glow)"><animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  <!-- Node Right -->
  <g transform="translate(700, 120)">
    <circle cx="0" cy="0" r="8" fill="#ec4899" filter="url(#soft-glow)"><animate attributeName="r" values="7;11;7" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Floating UI Badges -->
  <g transform="translate(140, 75)">
    <rect width="115" height="28" rx="8" fill="#0a0a19" fill-opacity="0.85" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10b981"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <text x="28" y="18" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">AI Engine Online</text>
  </g>

  <g transform="translate(565, 235)">
    <rect width="115" height="28" rx="8" fill="#0a0a19" fill-opacity="0.85" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M 10,14 L 14,10 L 18,14 L 14,18 Z" fill="#ec4899" />
    <text x="28" y="18" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">E2EE Secured</text>
  </g>

  <!-- Main Title Typography -->
  <text x="410" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="5" fill="#ffffff">
    ADVENTURE NEXUS
  </text>
  <text x="410" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="5" fill="none" stroke="url(#neon-glow)" stroke-width="1" opacity="0.7">
    ADVENTURE NEXUS
  </text>

  <!-- Subtitle -->
  <text x="410" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2">
    THE INTELLIGENT TRAVEL ECOSYSTEM &amp; SOCIAL FABRIC
  </text>
</svg>
